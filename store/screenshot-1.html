<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'IBM Plex Sans Arabic'; font-weight: 700; src: url(../extension/fonts/arabic-700.woff2) format('woff2'); }
body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: #0b0b0d; font-family: 'IBM Plex Sans Arabic', sans-serif; }
.shade { position: absolute; inset: 0; background: linear-gradient(to left, #0b0b0df2 0%, #0b0b0dcc 34%, #0b0b0d00 60%); }
h1 { position: absolute; top: 120px; right: 64px; width: 420px; margin: 0; color: #f2f2f4; font-size: 46px; line-height: 1.4; }
h1 span { color: #7dffc4; }
.player { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(5px) brightness(.8); }
iframe { position: absolute; top: 330px; right: 64px; width: 312px; height: 232px; border: 1px solid #1fae6a; border-radius: 14px; }
</style>
</head>
<body>
<img class="player" src="player.png" alt=""><div class="shade"></div>
<h1>تويتش <span>بدون إعلانات</span><br>واتفرّج براحتك</h1>
<iframe src="../extension/popup.html" onload="this.contentDocument.getElementById('protected-count').textContent = (128).toLocaleString('ar')"></iframe>
</body>
</html>
